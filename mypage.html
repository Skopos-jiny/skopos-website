<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>마이페이지 | SKOPOS 스코포스</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#F7F8FC;min-height:100vh;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.06);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.nav-logo{font-size:1.1rem;font-weight:900;color:#0F0F1A;text-decoration:none}
.nav-logo span{color:#E91E8C}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-user{font-size:.8rem;color:#8890A4;font-weight:600}
.btn-logout{font-size:.78rem;color:#8890A4;background:none;border:1px solid rgba(0,0,0,.1);border-radius:50px;padding:6px 14px;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-logout:hover{border-color:#E91E8C;color:#E91E8C}
.container{max-width:760px;margin:0 auto;padding:28px 20px 60px}

/* 프로필 카드 */
.profile-card{background:linear-gradient(135deg,#0F0F1A,#1E1040);border-radius:20px;padding:26px;margin-bottom:22px;display:flex;align-items:center;gap:18px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#E91E8C,#FF6B9D);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:#fff;flex-shrink:0}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:1.05rem;font-weight:800;color:#fff;margin-bottom:3px}
.profile-email{font-size:.76rem;color:rgba(255,255,255,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-badge{display:inline-block;font-size:.62rem;font-weight:700;padding:3px 10px;border-radius:50px;margin-top:6px}
.badge-kakao{background:#FEE500;color:#191919}
.badge-naver{background:#03C75A;color:#fff}
.badge-email{background:rgba(233,30,140,.2);color:#FF6B9D}
.profile-stat{text-align:right;flex-shrink:0}
.stat-num{font-size:1.5rem;font-weight:900;color:#E91E8C}
.stat-label{font-size:.68rem;color:rgba(255,255,255,.35);margin-top:2px}

/* 섹션 */
.section{background:#fff;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-tag{font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#E91E8C}
.section-title{font-size:1rem;font-weight:800;color:#0F0F1A;margin-top:4px}

/* 탭 */
.tab-row{display:flex;background:#F7F8FC;border-radius:10px;padding:3px;margin-bottom:20px}
.tab-btn{flex:1;padding:8px;text-align:center;font-size:.78rem;font-weight:700;color:#8890A4;border-radius:8px;cursor:pointer;border:none;background:none;font-family:inherit;transition:all .2s}
.tab-btn.active{background:#fff;color:#0F0F1A;box-shadow:0 1px 6px rgba(0,0,0,.08)}

/* 진단 결과 카드 */
.result-card{border:1.5px solid rgba(0,0,0,.07);border-radius:14px;padding:18px;margin-bottom:12px;display:flex;align-items:center;gap:14px;transition:all .2s}
.result-card:hover{border-color:rgba(233,30,140,.2);transform:translateX(2px)}
.result-emoji{font-size:2rem;flex-shrink:0}
.result-info{flex:1;min-width:0}
.result-type{font-size:.95rem;font-weight:800;color:#0F0F1A;margin-bottom:3px}
.result-meta{font-size:.72rem;color:#8890A4}
.result-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.btn-sm{font-size:.72rem;font-weight:700;padding:6px 14px;border-radius:50px;cursor:pointer;border:none;font-family:inherit;transition:all .2s;white-space:nowrap}
.btn-view{background:rgba(233,30,140,.08);color:#E91E8C}
.btn-view:hover{background:rgba(233,30,140,.15)}
.btn-pdf{background:#0F0F1A;color:#fff}
.btn-pdf:hover{background:#2A2A3C}
.btn-pdf:disabled{opacity:.5;cursor:not-allowed}
.badge-type{font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:50px;white-space:nowrap}
.badge-premium{background:linear-gradient(135deg,#E91E8C,#FF9800);color:#fff}
.badge-free{background:rgba(0,0,0,.06);color:#8890A4}

/* 결제 내역 */
.pay-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.pay-item:last-child{border-bottom:none}
.pay-left{flex:1;min-width:0}
.pay-name{font-size:.88rem;font-weight:700;color:#0F0F1A;margin-bottom:3px}
.pay-detail{font-size:.72rem;color:#8890A4}
.pay-right{text-align:right;flex-shrink:0;margin-left:12px}
.pay-amount{font-size:.9rem;font-weight:800;color:#0F0F1A;margin-bottom:3px}
.pay-status{display:inline-block;font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:50px;background:rgba(3,199,90,.1);color:#027a35}
.pay-status.free{background:rgba(233,30,140,.08);color:#C2185B}.pay-status.cancel{background:rgba(0,0,0,.06);color:#8890A4}.pay-status.wait{background:#FFF4E0;color:#B26A00}
.pay-link{font-size:.68rem;font-weight:800;color:#E91E8C;margin-left:6px;text-decoration:none;white-space:nowrap}
/* 커플 진단 */
.couple-card{border:1.5px solid rgba(233,30,140,.25);background:linear-gradient(160deg,#FFF5FA,#fff 60%);border-radius:16px;padding:18px;margin-bottom:16px}
.cc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cc-tag{font-size:.64rem;font-weight:800;color:#fff;background:linear-gradient(135deg,#7E57C2,#DC1478);border-radius:50px;padding:3px 10px}
.cc-code{font-size:.68rem;color:#8890A4;font-weight:700;letter-spacing:.04em}
.cc-title{font-size:1.02rem;font-weight:900;color:#0F0F1A;margin:8px 0 2px}
.cc-step{font-size:.76rem;color:#8890A4}.cc-step.ok{color:#027a35;font-weight:700}
.cc-docs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cc-doc{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:12px;padding:12px}
.cc-doc b{display:block;font-size:.8rem;color:#0F0F1A}.cc-doc span{display:block;font-size:.7rem;color:#8890A4;margin:2px 0 10px}
.cc-btns{display:flex;gap:6px;flex-wrap:wrap}
.cc-btns a{text-decoration:none}
@media(max-width:500px){.cc-docs{grid-template-columns:1fr}}

/* 빈 상태 */
.empty{text-align:center;padding:36px 0}
.empty-icon{font-size:2.8rem;margin-bottom:10px}
.empty-text{font-size:.86rem;color:#8890A4;line-height:1.7;margin-bottom:16px}
.btn-cta{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#E91E8C,#FF6B9D);color:#fff;border-radius:50px;font-size:.85rem;font-weight:800;text-decoration:none;transition:all .2s}
.btn-cta:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(233,30,140,.3)}

/* 로딩 */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:#8890A4;font-size:.86rem;gap:10px}
.spinner{width:20px;height:20px;border:2px solid rgba(233,30,140,.2);border-top-color:#E91E8C;border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F0F1A;color:#fff;padding:10px 22px;border-radius:50px;font-size:.8rem;font-weight:700;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 계정 관리 */
.account-box{margin-top:28px;padding:18px 20px;border:1px solid #EFE6D8;border-radius:16px;background:#fff}
.account-box h4{font-size:.86rem;font-weight:900;color:#1A1A2E;margin:0 0 6px}
.account-box p{font-size:.78rem;color:#8890A4;line-height:1.7;margin:0 0 12px}
.btn-withdraw{background:none;border:1px solid #E3D9CC;color:#8890A4;padding:8px 16px;border-radius:50px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-withdraw:hover{border-color:#C44;color:#C44}

/* 탈퇴 모달 */
.wd-overlay{position:fixed;inset:0;background:rgba(15,15,26,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.wd-overlay.show{display:flex}
.wd-card{background:#fff;border-radius:20px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;padding:26px 24px}
.wd-card h3{font-size:1.05rem;font-weight:900;margin:0 0 14px;color:#1A1A2E}
.wd-card h5{font-size:.8rem;font-weight:900;margin:16px 0 6px;color:#1A1A2E}
.wd-card ul{margin:0;padding-left:18px}
.wd-card li{font-size:.8rem;color:#5A5A6E;line-height:1.85}
.wd-note{background:#FBF6EC;border-radius:12px;padding:12px 14px;font-size:.76rem;color:#6B6B80;line-height:1.75;margin-top:14px}
.wd-label{display:block;font-size:.78rem;font-weight:700;color:#1A1A2E;margin:18px 0 6px}
.wd-card input,.wd-card select{width:100%;padding:11px 13px;border:1px solid #E3D9CC;border-radius:10px;font-size:.86rem;font-family:inherit;box-sizing:border-box}
.wd-card input:focus,.wd-card select:focus{outline:none;border-color:#E91E8C}
.wd-actions{display:flex;gap:8px;margin-top:20px}
.wd-actions button{flex:1;padding:12px;border-radius:50px;font-size:.86rem;font-weight:700;cursor:pointer;font-family:inherit;border:none}
.wd-cancel{background:#F3EFE8;color:#5A5A6E}
.wd-go{background:#C44;color:#fff}
.wd-go:disabled{opacity:.4;cursor:not-allowed}

/* 패널 */
.panel{display:none}
.panel.active{display:block}
@media(max-width:500px){.result-actions{gap:6px}.btn-sm{font-size:.66rem;padding:5px 10px}}
</style>
<script src="/skopos-track.js" defer></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/skopos-characters.js"></script>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">SKO<span>POS</span></a>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>
</nav>

<div class="container">

  <!-- 프로필 -->
  <div class="profile-card">
    <div class="avatar" id="avatarEl">?</div>
    <div class="profile-info">
      <div class="profile-name" id="profileName">로딩 중...</div>
      <div class="profile-email" id="profileEmail"></div>
      <span class="profile-badge" id="profileBadge"></span>
    </div>
    <div class="profile-stat">
      <div class="stat-num" id="statNum">0</div>
      <div class="stat-label">완료한 검사</div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('results',this)">🎯 나의 검사 결과</button>
    <button class="tab-btn" onclick="switchTab('payments',this)">💳 결제 내역</button>
  </div>

  <!-- 검사 결과 패널 -->
  <div class="panel active" id="panelResults">
    <div id="coupleArea"></div>
    <div id="resultsArea"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>

  <!-- 결제 내역 패널 -->
  <div class="panel" id="panelPayments">
    <div id="paymentsArea"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>

  <!-- 계정 관리 -->
  <div class="account-box">
    <h4>계정 관리</h4>
    <p>더 이상 SKOPOS를 이용하지 않으신다면 회원 탈퇴를 신청하실 수 있습니다. 탈퇴 시 검사 결과와 계정 정보는 즉시 삭제되며 복구할 수 없습니다.</p>
    <button class="btn-withdraw" onclick="openWithdraw()">회원 탈퇴</button>
  </div>

</div>

<!-- 회원 탈퇴 모달 -->
<div class="wd-overlay" id="wdOverlay" role="dialog" aria-modal="true" aria-label="회원 탈퇴">
  <div class="wd-card">
    <h3>회원 탈퇴</h3>
    <div id="wdBody"><div class="loading"><div class="spinner"></div>확인 중...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL  = 'https://rgbukqphcqptnfeqipfn.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnYnVrcXBoY3FwdG5mZXFpcGZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTkzMDMsImV4cCI6MjA5NDI3NTMwM30.fWUHe2AoWr9fMLUNSQkbhosUO7FH9dvZOIZbz_XyzFM';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

let currentUser = null;

// ── 유형 정보 ────────────────────────────────────────────────
const TYPE_INFO = {
  'sanctuary_deep': {name:'고요한 회복형',      emoji:'🌙'},
  'sanctuary_zen':  {name:'비움 추구형',        emoji:'🤍'},
  'nature_forest':  {name:'초록 충전형',        emoji:'🌿'},
  'nature_earth':   {name:'핸드메이드 감성형',  emoji:'🪴'},
  'luxe_royal':     {name:'품격 감각형',        emoji:'✨'},
  'luxe_gallery':   {name:'갤러리 큐레이터형',  emoji:'🖼️'},
  'artistic_wild':  {name:'개성 표현형',        emoji:'🎨'},
  'artistic_indie': {name:'빈티지 스토리형',    emoji:'🕰️'},
  'minimal_pure':   {name:'순수 미니멀형',      emoji:'◻️'},
  'minimal_grid':   {name:'구조·정렬 추구형',   emoji:'⬛'},
  'cozy_hearth':    {name:'포근한 회복형',      emoji:'🛋️'},
  'cozy_family':    {name:'함께하는 공간형',    emoji:'🏡'},
};

// ── 탭 전환 ──────────────────────────────────────────────────
function switchTab(tab, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
}

// ── 토스트 ───────────────────────────────────────────────────
function toast(msg, dur=2800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

// ── 초기화 ───────────────────────────────────────────────────
(async()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    window.location.href = 'login.html?redirect=mypage.html';
    return;
  }
  currentUser = session.user;
  const meta     = session.user.user_metadata || {};
  const provider = session.user.app_metadata?.provider || 'email';
  const name     = meta.full_name || meta.name || session.user.email?.split('@')[0] || '사용자';
  const email    = session.user.email || '';

  document.getElementById('avatarEl').textContent   = name.charAt(0).toUpperCase();
  document.getElementById('profileName').textContent = name;
  document.getElementById('profileEmail').textContent= email;
  document.getElementById('navUser').textContent     = name + '님';

  const badgeEl = document.getElementById('profileBadge');
  if(provider==='kakao'){badgeEl.textContent='카카오 로그인';badgeEl.className='profile-badge badge-kakao';}
  else if(provider==='naver'){badgeEl.textContent='네이버 로그인';badgeEl.className='profile-badge badge-naver';}
  else{badgeEl.textContent='이메일 가입';badgeEl.className='profile-badge badge-email';}

  // 병렬 로드
  await Promise.all([renderResults(session.user), renderPayments(session.user), renderCouple(session)]);
})();

// ── 검사 결과 렌더링 ─────────────────────────────────────────
async function renderResults(user){
  const area = document.getElementById('resultsArea');
  const { data, error } = await sb
    .from('quiz_results')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false });

  if(error || !data || data.length === 0){
    // 세션스토리지 폴백
    const premId = sessionStorage.getItem('skopos_premium_result');
    const freeId = sessionStorage.getItem('skopos_result');
    if(!premId && !freeId){
      area.innerHTML = `<div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">아직 완료한 검사가 없어요<br>지금 바로 내 공간 욕구 유형을 확인해보세요!</div>
        <a class="btn-cta" href="skopos_quiz.html">SDTI 기초 검사 (무료)</a>
      </div>`;
      document.getElementById('statNum').textContent = '0';
      return;
    }
    // 세션에서 임시 표시
    let cards = [];
    if(premId){ const t=TYPE_INFO[premId]||{name:premId,emoji:'✨'}; cards.push({result_type:premId,quiz_type:'SDTI 정밀',created_at:new Date().toISOString(),t}); }
    if(freeId){ const t=TYPE_INFO[freeId]||{name:freeId,emoji:'✨'}; cards.push({result_type:freeId,quiz_type:'SDTI 기초',created_at:new Date().toISOString(),t}); }
    area.innerHTML = cards.map(r=>makeResultCard(r)).join('');
    document.getElementById('statNum').textContent = cards.length;
    return;
  }

  document.getElementById('statNum').textContent = data.length;
  area.innerHTML = data.map(r=>makeResultCard(r)).join('');
}

function makeResultCard(r){
  const t   = TYPE_INFO[r.result_type] || {name: r.result_name||r.result_type, emoji:'✨'};
  const date = r.created_at ? new Date(r.created_at).toLocaleDateString('ko-KR') : '';
  const isPrem = r.quiz_type && r.quiz_type.includes('정밀');
  const resultUrl = isPrem
    ? `skopos_premium_quiz.html?r=${btoa(encodeURIComponent(r.result_type))}`
    : `skopos_quiz.html`;
  const pdfBtn = isPrem
    ? `<button class="btn-sm btn-pdf" onclick="redownloadPDF('${r.result_type}','${r.result_name||t.name}')" title="PDF 리포트 다운로드">📄 PDF 저장</button>`
    : '';
  return `<div class="result-card">
    <span class="result-emoji">${SkoposCharacters.html(r.result_type,64)}</span>
    <div class="result-info">
      <div class="result-type">${t.name}</div>
      <div class="result-meta">${r.quiz_type||'기초'} 검사 · ${date}</div>
    </div>
    <div class="result-actions">
      <span class="badge-type ${isPrem?'badge-premium':'badge-free'}">${r.quiz_type||'기초'}</span>
      <a class="btn-sm btn-view" href="${resultUrl}">결과 보기</a>
      ${pdfBtn}
    </div>
  </div>`;
}

// ── 결제 내역 렌더링 ─────────────────────────────────────────
async function fetchPayments(user){
  return sb.from('payments')
    .select('*')
    .or(`user_id.eq.${user.id},buyer_email.eq.${user.email}`)
    .order('created_at', { ascending: false });
}
function payLabel(p){
  const st = String(p.status||'').toLowerCase();
  if(st==='paid') return ['결제완료','ok'];
  if(st==='free') return [p.pg==='couple'?'커플 초대 이용권':'무료 이용권','free'];
  if(st==='cancelled'||st==='canceled'||st==='refunded') return ['결제취소','cancel'];
  return ['처리중','wait'];
}
function payName(p){
  const n = p.order_name || 'SDTI 정밀 검사';
  if(/커플/.test(n)) return n.replace('SKOPOS SDTI ','').replace('커플 패키지','커플 진단').replace('(파트너 이용권)','· 파트너 이용권');
  return n.replace('SKOPOS SDTI ','SDTI ');
}
function payMethod(p){
  if(p.pg==='FREE_COUPON') return '쿠폰'+(p.coupon_code?` (${p.coupon_code})`:'');
  if(p.pg==='couple') return '커플 진단 초대';
  return p.pg || '카드 결제';
}
async function renderPayments(user){
  const area = document.getElementById('paymentsArea');
  let { data, error } = await fetchPayments(user);
  if(error){
    // 로그인 세션 갱신 후 한 번 더 시도
    try{ await sb.auth.refreshSession(); ({ data, error } = await fetchPayments(user)); }catch(e){}
  }
  if(error){
    console.warn('결제 내역 조회 오류:', error);
    area.innerHTML = `<div class="empty">
      <div class="empty-icon">⚠️</div>
      <div class="empty-text">결제 내역을 불러오지 못했어요<br>잠시 후 다시 시도해 주세요</div>
      <button class="btn-cta" style="border:0;cursor:pointer;font-family:inherit" onclick="location.reload()">다시 불러오기</button>
    </div>`;
    return;
  }
  if(!data || data.length === 0){
    area.innerHTML = `<div class="empty">
      <div class="empty-icon">💳</div>
      <div class="empty-text">아직 결제 내역이 없어요<br>SDTI 정밀 검사로 더 깊이 알아보세요</div>
      <a class="btn-cta" href="payment.html">SDTI 정밀 검사 ₩29,900</a>
    </div>`;
    return;
  }

  area.innerHTML = `<div>
    ${data.map(p=>{
      const at = new Date(p.paid_at || p.created_at);
      const date = at.toLocaleDateString('ko-KR');
      const time = at.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
      const amt = Number(p.final_amount ?? p.amount ?? 0);
      const [lb, cls] = payLabel(p);
      const isCouple = /커플/.test(p.order_name||'') || p.pg==='couple';
      return `<div class="pay-item">
        <div class="pay-left">
          <div class="pay-name">${payName(p)}${isCouple?' <a class="pay-link" href="couple.html">결과지 보기</a>':''}</div>
          <div class="pay-detail">${date} ${time} · ${payMethod(p)} · 주문번호 ${(p.merchant_uid||p.imp_uid||'').slice(-12)}</div>
        </div>
        <div class="pay-right">
          <div class="pay-amount">${amt>0?'₩'+amt.toLocaleString():'무료'}</div>
          <span class="pay-status ${cls}">${lb}</span>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div style="margin-top:16px;padding:12px 14px;background:#F7F8FC;border-radius:10px;font-size:.74rem;color:#8890A4;line-height:1.7">
    💡 결제 관련 문의: skopos@skopos.kr · 환불은 결제일로부터 7일 이내 미이용 시 가능
  </div>`;
}

// ── 커플 진단 결과지 ─────────────────────────────────────────
async function renderCouple(session){
  const area = document.getElementById('coupleArea');
  try{
    const r = await fetch(SUPABASE_URL + '/functions/v1/couple', {method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token}, body:JSON.stringify({action:'status'})});
    const j = await r.json();
    if(!j.success || !j.couple) return;
    const c = j.couple, my = c.my_name || '나', pt = c.partner_name || '파트너';
    const ready = c.my_done && c.partner_done;
    const step = !c.paired ? '파트너 초대를 기다리고 있어요' : !c.my_done ? '내 정밀 검사를 진행해 주세요' : !c.partner_done ? `${pt}님의 정밀 검사를 기다리고 있어요` : '결과지 2부가 발급됐어요';
    area.innerHTML = `<div class="couple-card">
      <div class="cc-top"><span class="cc-tag">커플 진단</span><span class="cc-code">초대 코드 ${c.code}</span></div>
      <div class="cc-title">${my}님 × ${c.paired?pt+'님':'파트너'}</div>
      <div class="cc-step ${ready?'ok':''}">${step}</div>
      ${ready ? `<div class="cc-docs">
        <div class="cc-doc"><b>결과지 1 · 개인 결과지</b><span>나의 8개 영역 프로파일과 공간 처방</span>
          <div class="cc-btns"><a class="btn-sm btn-view" href="couple.html#personal">보기</a><a class="btn-sm btn-pdf" href="couple.html?dl=personal" target="_blank" rel="noopener">📄 PDF 저장</a></div></div>
        <div class="cc-doc"><b>결과지 2 · 커플 솔루션 결과지</b><span>두 사람 비교와 공간별 솔루션</span>
          <div class="cc-btns"><a class="btn-sm btn-view" href="couple.html#couple">보기</a><a class="btn-sm btn-pdf" href="couple.html?dl=couple" target="_blank" rel="noopener">📄 PDF 저장</a></div></div>
      </div>` : `<div class="cc-btns" style="margin-top:12px"><a class="btn-sm btn-view" href="couple.html">진행 상황 보기</a></div>`}
    </div>`;
  }catch(e){ console.warn('커플 정보 조회 오류:', e); }
}

async function logout(){
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

// ── 회원 탈퇴 ────────────────────────────────────────────────
const WD_FN = SUPABASE_URL + '/functions/v1/delete-account';

async function wdCall(payload){
  const { data: sess } = await sb.auth.getSession();
  const token = sess && sess.session ? sess.session.access_token : '';
  if(!token){ window.location.href='login.html'; return null; }
  const res = await fetch(WD_FN, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token, 'apikey':SUPABASE_ANON },
    body: JSON.stringify(payload)
  });
  let j={};
  try{ j = await res.json(); }catch(e){}
  return { ok: res.ok, data: j };
}

function closeWithdraw(){
  document.getElementById('wdOverlay').classList.remove('show');
}

async function openWithdraw(){
  const ov = document.getElementById('wdOverlay');
  const body = document.getElementById('wdBody');
  body.innerHTML = '<div class="loading"><div class="spinner"></div>확인 중...</div>';
  ov.classList.add('show');
  try{ if(window.gtag) gtag('event','withdraw_open'); }catch(e){}

  const r = await wdCall({ action:'preview' });
  if(!r){ return; }
  if(!r.ok){
    body.innerHTML = '<p style="font-size:.84rem;color:#C44">'+((r.data&&r.data.message)||'잠시 후 다시 시도해 주세요.')+'</p>'
      + '<div class="wd-actions"><button class="wd-cancel" onclick="closeWithdraw()">닫기</button></div>';
    return;
  }

  const s = r.data.summary || {};
  const quizTotal = (s.quiz_results||0) + (s.premium_results||0);
  const payTotal  = s.payments_total || 0;
  const coupleAny = (s.couples_owned||0) + (s.couples_joined||0);

  let deleteItems = '<li>계정 정보 (이메일, 로그인 수단)</li>';
  if(quizTotal) deleteItems += '<li>검사 결과 '+quizTotal+'건 (기초, 정밀)</li>';
  if(s.intake_responses) deleteItems += '<li>설문 응답 '+s.intake_responses+'건 (휴대폰 번호 포함)</li>';
  if(s.seasonal_subscriptions) deleteItems += '<li>계절 가이드 구독 정보</li>';
  if(coupleAny) deleteItems += '<li>커플 진단 연결 정보</li>';

  let keepItems = '';
  if(payTotal){
    keepItems = '<h5>법령에 따라 보관되는 항목</h5><ul>'
      + '<li>결제 기록 '+payTotal+'건: 5년 보관 (전자상거래법 제6조)</li>'
      + '</ul><div class="wd-note">보관되는 결제 기록은 계정과의 연결이 끊겨 특정 개인을 알아볼 수 없는 상태로 저장되며, 환불 분쟁과 세무 대응 목적 외에는 사용되지 않습니다.</div>';
  }

  let coupleWarn = '';
  if(s.couples_owned){
    coupleWarn = '<div class="wd-note" style="background:#FFF4F4;color:#A33">커플 진단을 결제하신 계정입니다. 탈퇴하시면 함께하신 분의 화면에서도 비교 리포트를 더 이상 보실 수 없게 됩니다.</div>';
  }

  body.innerHTML =
    '<h5>즉시 삭제되는 항목</h5><ul>'+deleteItems+'</ul>'
    + keepItems
    + coupleWarn
    + '<label class="wd-label" for="wdReason">탈퇴 사유 (선택)</label>'
    + '<select id="wdReason">'
      + '<option value="">선택 안 함</option>'
      + '<option value="더 이상 필요하지 않음">더 이상 필요하지 않음</option>'
      + '<option value="검사 결과가 기대와 달랐음">검사 결과가 기대와 달랐음</option>'
      + '<option value="가격이 부담됨">가격이 부담됨</option>'
      + '<option value="개인정보가 걱정됨">개인정보가 걱정됨</option>'
      + '<option value="기타">기타</option>'
    + '</select>'
    + '<label class="wd-label" for="wdConfirm">확인을 위해 <b>탈퇴합니다</b> 를 입력해 주세요</label>'
    + '<input id="wdConfirm" type="text" autocomplete="off" placeholder="탈퇴합니다">'
    + '<div class="wd-actions">'
      + '<button class="wd-cancel" onclick="closeWithdraw()">취소</button>'
      + '<button class="wd-go" id="wdGo" disabled onclick="doWithdraw()">탈퇴하기</button>'
    + '</div>';

  const input = document.getElementById('wdConfirm');
  const go = document.getElementById('wdGo');
  input.addEventListener('input', ()=>{ go.disabled = input.value.trim() !== '탈퇴합니다'; });
  input.focus();
}

async function doWithdraw(){
  const go = document.getElementById('wdGo');
  const input = document.getElementById('wdConfirm');
  const reasonEl = document.getElementById('wdReason');
  go.disabled = true; go.textContent = '처리 중...';

  const r = await wdCall({
    action:'delete',
    confirm: input.value.trim(),
    reason: reasonEl ? reasonEl.value : ''
  });
  if(!r) return;
  if(!r.ok || !r.data.success){
    go.disabled = false; go.textContent = '탈퇴하기';
    toast((r.data && r.data.message) || '잠시 후 다시 시도해 주세요.');
    return;
  }

  try{ if(window.gtag) gtag('event','withdraw_complete'); }catch(e){}
  document.getElementById('wdBody').innerHTML =
    '<p style="font-size:.86rem;color:#5A5A6E;line-height:1.8">탈퇴가 완료되었습니다.<br>그동안 SKOPOS를 이용해 주셔서 감사합니다.</p>'
    + '<div class="wd-actions"><button class="wd-cancel" onclick="location.href=\'index.html\'">홈으로</button></div>';
  try{ await sb.auth.signOut(); }catch(e){}
  setTimeout(()=>{ window.location.href = 'index.html'; }, 3000);
}

document.getElementById('wdOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'wdOverlay') closeWithdraw();
});
</script>
