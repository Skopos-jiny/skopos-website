body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--dark);-webkit-font-smoothing:antialiased;line-height:1.6}

.card{background:#fff;border-radius:20px;padding:26px 22px;box-shadow:0 4px 24px rgba(0,0,0,.06);margin-bottom:18px}
.eyebrow{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;background:var(--pink);border-radius:50px;padding:4px 12px;margin-bottom:12px}

.muted{color:var(--gray);font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:14px 20px;font-weight:800;font-size:.95rem;cursor:pointer;text-decoration:none;font-family:inherit}

.code-box{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:14px 16px;border:2px dashed rgba(233,30,140,.35);border-radius:14px;background:#FDF0F6}

.steps{list-style:none;margin-top:14px}

.steps li:last-child{border:0}
.dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:900;flex:none;background:#EEE;color:#999}
.dot.ok{background:var(--pink);color:#fff}
.alert{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:#FFF1F1;color:#C62828;font-size:.85rem}
.alert.show{display:block}

.pcard .tn{font-size:1.02rem;font-weight:900}

.dom-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

.dt{font-size:.84rem;color:var(--mid);margin-top:6px}
.ins.soft{background:#F6F5FA}
.link-card{border:1.5px solid rgba(233,30,140,.25)}

.sum div{background:#F7F6FB;border-radius:14px;padding:12px 8px;text-align:center}

.sum b.g{color:#2E7D32}.sum b.o{color:#E65100}.sum b.p{color:var(--pink2)}
.room-row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.room-row:last-child{border:0}
.rn{font-weight:900;font-size:.95rem;display:flex;gap:8px;align-items:flex-start}.rn span{width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font-size:.72rem;display:grid;place-items:center;flex:none;margin-top:1px}
.rb p{font-size:.86rem;color:var(--mid);margin-bottom:6px}.rb p:last-child{margin:0}.rb b{color:var(--dark)}
.plan{list-style:none;counter-reset:none;margin-top:6px}
.plan li{display:flex;flex-direction:column;padding:12px 0 12px 16px;border-left:3px solid #F3D3E3;margin-left:6px;position:relative}
.plan li::before{content:"";position:absolute;left:-7px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--pink)}
.plan b{font-size:.92rem}.plan span{font-size:.85rem;color:var(--mid)}
.chk{list-style:none;margin-top:8px}.chk li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}.chk li:last-child{border:0}
.chk input{width:18px;height:18px;accent-color:var(--pink);vertical-align:-3px;margin-right:6px}
@media (max-width:520px){.sum{grid-template-columns:repeat(2,1fr)}.room-row{grid-template-columns:1fr;gap:6px}.tabs{top:62px}.ptype .em{width:54px;height:54px;font-size:2.1rem}}

async function call(action, extra){

}
function inviteUrl(code){ return location.origin + '/couple.html?invite=' + encodeURIComponent(code); }
async function share(){
  const code=window.__couple&&window.__couple.code, my=window.__couple&&window.__couple.my_name;
  const url = inviteUrl(code);
  const text = (my?my+'님이 ':'')+'SKOPOS 커플 공간 검사에 초대했어요. 링크로 로그인하면 정밀 검사를 바로 시작할 수 있어요.';
  try{ if(navigator.share){ await navigator.share({title:'SKOPOS 커플 검사 초대',text,url}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(url); alert('초대 링크를 복사했어요. 함께할 분께 보내 주세요.'); }catch(e){ prompt('아래 링크를 복사해 보내 주세요', url); }
}

const ROOMS = [
  {n:'거실', d:['social','sensory','objects','identity']},
  {n:'침실', d:['restore','sensory','color']},
  {n:'주방·식탁', d:['life','spatial','social']},
  {n:'현관·수납', d:['spatial','objects']},
  {n:'개인 코너·작업 공간', d:['identity','restore','life']},

function level(v){ return v>=70?['hi','강함']:v>=50?['mid','보통']:['lo','약함']; }
function today(){ const d=new Date(); return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; }
function ymd(){ const d=new Date(); return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function b64(s){ try{ return btoa(encodeURIComponent(s)); }catch(e){ return ''; } }

let RPT = null;   // 리포트 데이터
let personWho = 'me';

function setDoc(doc){
  document.querySelectorAll('.doc').forEach(el=>el.hidden = el.dataset.doc!==doc);

function coupleHTML(){
  const r = RPT, an=r.an, bn=r.bn, ta=r.ta, tb=r.tb, A=r.A, B=r.B;
  const rows = SECS.map(s=>{const a=Number(A.scores?.[s.key]||0), b=Number(B.scores?.[s.key]||0);return {s,a,b,d:Math.abs(a-b)};});
  const byKey = {}; rows.forEach(x=>byKey[x.s.key]=x);
  const diffs = rows.slice().sort((x,y)=>y.d-x.d);
  const top = diffs.filter(x=>x.d>=9).slice(0,3);
  const common = rows.filter(x=>x.a>=65&&x.b>=65).sort((x,y)=>(y.a+y.b)-(x.a+x.b)).slice(0,2);
  const closest = rows.slice().sort((x,y)=>x.d-y.d).slice(0,2);
  const avg = Math.round(rows.reduce((s,x)=>s+x.d,0)/rows.length);
  const cnt = {same:0,mid:0,far:0}; rows.forEach(x=>cnt[band(x.d)[0]]++);
  const sameType = A.type===B.type, sameGroup = ta.g && ta.g===tb.g;
  const pairLine = sameType ? `두 분은 같은 <b>${esc(ta.n)}</b>이에요. 원하는 집의 방향이 같아 결정이 빠른 대신, 둘 다 약한 부분은 집에서도 비어 있기 쉬워요.`
    : sameGroup ? `두 분은 같은 <b>${esc(GROUP[ta.g])}</b> 계열 안에서 결이 조금 다른 조합이에요. 큰 방향은 맞고 디테일에서 취향이 갈려요.`
    : `<b>${esc(GROUP[ta.g]||'')}</b> 계열과 <b>${esc(GROUP[tb.g]||'')}</b> 계열의 조합이에요. 집에서 채우고 싶은 것이 서로 달라, 미리 역할을 나누면 오히려 서로 부족한 부분을 채워 줄 수 있어요.`;
  const who = x => x.a>=x.b ? [an,bn] : [bn,an];
  const rooms = ROOMS.map(rm=>{
    const ds = rm.d.map(k=>byKey[k]);
    const base = ds.slice().sort((x,y)=>(y.a+y.b)-(x.a+x.b))[0];
    const gap = ds.slice().sort((x,y)=>y.d-x.d)[0];
    return {rm, base, gap};
  }).sort((x,y)=>y.gap.d-x.gap.d);
  const docNo = 'SKOPOS-CP-'+r.code+'-'+ymd();
  return `
  <div class="card hero"><div class="meta light"><span>커플 솔루션 결과지</span><span>발급번호 ${esc(docNo)} · 발급일 ${today()}</span></div>
    <h1>${esc(an)}님 × ${esc(bn)}님의<br>공간 솔루션</h1>
    <p class="sub">${pairLine}</p>
    <div class="pair">
      <div class="pcard"><div class="who a">${esc(an)}</div><div class="em">${ta.e}</div><div class="tn">${esc(ta.n)}</div><div class="tl">${esc(ta.l)}</div></div>
      <div class="pcard"><div class="who b">${esc(bn)}</div><div class="em">${tb.e}</div><div class="tn">${esc(tb.n)}</div><div class="tl">${esc(tb.l)}</div></div>
    </div>
  </div>

  <div class="card"><h2>한눈에 보는 요약</h2>
    <div class="sum"><div><b>${avg}점</b><span>8개 영역 평균 차이</span></div><div><b class="g">${cnt.same}</b><span>비슷해요</span></div><div><b class="o">${cnt.mid}</b><span>조금 달라요</span></div><div><b class="p">${cnt.far}</b><span>많이 달라요</span></div></div>
    <p class="muted" style="margin-top:10px">차이가 8점 이하면 비슷해요, 9~17점은 조금 달라요, 18점 이상은 많이 달라요로 구분했어요.</p>
  </div>

  <div class="card"><h2>8개 영역 나란히 보기</h2>
    <div class="legend"><span><i style="background:var(--a)"></i>${esc(an)}</span><span><i style="background:var(--b)"></i>${esc(bn)}</span></div>
    ${rows.map(x=>{const [c,t]=band(x.d);return `<div class="dom"><div class="dom-h"><span class="dom-n">${esc(x.s.label)}</span><span class="chip ${c}">${t} · 차이 ${x.d}</span></div>
      <div class="bar"><span class="nm">${esc(an)}</span><span class="tr"><span class="fl" style="display:block;width:${x.a}%;background:var(--a)"></span></span><span class="v">${x.a}</span></div>
      <div class="bar"><span class="nm">${esc(bn)}</span><span class="tr"><span class="fl" style="display:block;width:${x.b}%;background:var(--b)"></span></span><span class="v">${x.b}</span></div></div>`;}).join('')}
  </div>

  <div class="card"><h2>우리 집의 공통 기반</h2><p class="muted">두 분이 비슷하게 원하는 영역은 결정이 쉬운 출발점이에요.</p>
    ${(common.length?common:closest).map(x=>`<div class="ins"><h3>${esc(x.s.label)}</h3><p>${common.length?'두 분 모두 이 욕구가 강해요. ':'두 분의 점수가 가장 가까운 영역이에요. '}${esc(DOM[x.s.key].room)}부터 함께 고르면 합의가 빨라요.</p></div>`).join('')}
  </div>

  <div class="card"><h2>부딪히기 쉬운 영역과 솔루션</h2><p class="muted">차이가 큰 순서예요. 누가 맞고 틀린 게 아니라, 집에 바라는 것이 다른 지점이에요.</p>
    ${top.length?top.map((x,i)=>{const [h,l]=who(x);return `<div class="ins"><h3>${i+1}. ${esc(x.s.label)} <span class="chip far">차이 ${x.d}</span></h3>
      <p><b>${esc(h)}</b>님은 ${esc(DOM[x.s.key].hi)}. <b>${esc(l)}</b>님은 ${esc(DOM[x.s.key].lo)}.</p>
      <p style="margin-top:6px"><b>이런 장면에서</b> ${esc(DOM[x.s.key].scene)}.</p>
      <div class="tip"><b>솔루션</b> ${esc(DOM[x.s.key].tip)}.</div>
      <div class="tip"><b>역할 나누기</b> 이 욕구가 더 강한 ${esc(h)}님이 기준안을 먼저 내고, ${esc(l)}님은 예산·관리 측면에서 조정해 주세요.</div></div>`;}).join('')
    :`<div class="ins"><h3>큰 차이가 없어요</h3><p>8개 영역 모두 차이가 크지 않은 조합이에요. 대신 두 분 다 약한 영역은 집에서도 놓치기 쉬우니 아래 공간별 솔루션을 참고해 주세요.</p></div>`}
  </div>

  <div class="card"><h2>공간별 솔루션 플랜</h2><p class="muted">조율이 더 필요한 공간부터 정리했어요.</p>
    ${rooms.map((x,i)=>{const [h,l]=who(x.gap); return `<div class="room-row"><div class="rn"><span>${i+1}</span>${esc(x.rm.n)}</div><div class="rb">
      <p><b>함께 원하는 것</b> ${esc(x.base.s.label)} (두 분 ${x.base.a}·${x.base.b}점). ${esc(PT[x.base.s.key])}.</p>
      ${x.gap.d>=9?`<p><b>조율 포인트</b> ${esc(x.gap.s.label)} 차이 ${x.gap.d}점. ${esc(DOM[x.gap.s.key].tip)}. 기준안은 ${esc(h)}님이 먼저 내 주세요.</p>`:`<p><b>조율 포인트</b> 큰 이견이 없는 공간이에요. 함께 원하는 것에 집중하세요.</p>`}
    </div></div>`;}).join('')}
  </div>

  <div class="card"><h2>30일 실천 플랜</h2>
    <ol class="plan">
      ${rooms.slice(0,3).map((x,i)=>`<li><b>${i+1}주차 · ${esc(x.rm.n)}</b><span>${x.gap.d>=9?esc(x.gap.s.label)+' 기준을 정하고 작은 변화 하나를 바로 실행해 보세요.':esc(x.base.s.label)+'을 살리는 소품이나 배치 하나를 함께 골라 보세요.'}</span></li>`).join('')}
      <li><b>4주차 · 함께 점검</b><span>바꾼 공간에서 각자 편해진 점과 아직 불편한 점을 한 가지씩 이야기해 보세요.</span></li>
    </ol>
  </div>

  <div class="card"><h2>합의 체크리스트</h2><p class="muted">하나씩 체크하며 함께 정해 보세요.</p>
    <ul class="chk">
      ${(top.length?top:diffs.slice(0,2)).map(x=>`<li><label><input type="checkbox"> ${esc(DOM[x.s.key].room)}에서 지킬 기준 한 가지를 함께 정했어요</label></li>`).join('')}
      <li><label><input type="checkbox"> 각자 "내 취향 존"을 한 곳씩 정했어요</label></li>
      <li><label><input type="checkbox"> 혼자 쉬고 싶을 때 쓰는 신호를 정했어요</label></li>
      <li><label><input type="checkbox"> 한 달 뒤 다시 이야기할 날짜를 정했어요</label></li>
    </ul>
  </div>

  <div class="card"><h2>함께 나눠 볼 대화 3가지</h2>
    <div class="q"><span class="qn">01</span><span>${esc((top[0]||diffs[0]).s.label)} 영역에서, 지금 집에서 가장 불편했던 순간은 언제였나요?</span></div>
    <div class="q"><span class="qn">02</span><span>각자 "이것만은 꼭 지키고 싶은 공간 한 곳"을 고른다면 어디인가요?</span></div>
    <div class="q"><span class="qn">03</span><span>다음 한 달 안에 둘이 함께 바꿔 볼 수 있는 가장 작은 변화는 무엇일까요?</span></div>
  </div>
  <div class="btn-row no-print"><button class="btn btn-p" onclick="printDoc('couple')">커플 솔루션 결과지 PDF 저장</button><button class="btn btn-s" onclick="setDoc('personal')">개인 결과지 보기</button></div>`;
}

function viewReport(r){
  const A=r.me, B=r.partner, c=r.couple||{};
  RPT = { A, B, an:A.name||'나', bn:B.name||'파트너',
    ta:TYPES[A.type]||{n:A.type,e:'🏠',g:'',l:''}, tb:TYPES[B.type]||{n:B.type,e:'🏠',g:'',l:''},
    code:c.code||'', role:c.role||'owner' };
  app.innerHTML = `
  <div class="tabs no-print" role="tablist" aria-label="결과지 선택">
    <button class="tab" role="tab" data-doc="personal" onclick="setDoc('personal')"><small>결과지 1</small>개인 결과지</button>
    <button class="tab" role="tab" data-doc="couple" onclick="setDoc('couple')"><small>결과지 2</small>커플 솔루션 결과지</button>
  </div>
  <section class="doc" data-doc="personal" id="personalDoc">${personalHTML('me')}</section>
  <section class="doc" data-doc="couple" id="coupleDoc">${coupleHTML()}</section>
  <p class="foot">SDTI 결과는 경향을 보여 주는 참고 자료예요. 두 분의 대화를 위한 출발점으로 활용해 주세요.<br>© SKOPOS · 검사 문항과 결과 콘텐츠는 한국저작권위원회에 저작권 등록된 스코포스의 창작물입니다</p>`;
  setDoc(location.hash==='#couple'?'couple':'personal');
  try{ window.SkoposTrack && SkoposTrack.event('couple_report_view',{}); }catch(e){}
}


async function main(user){
  try{
    const sbc = await SkoposAuth.getClient();
    const { data:{ session } } = await sbc.auth.getSession();
    token = session && session.access_token;
    if(!token){ viewNone('로그인 정보를 확인하지 못했어요. 새로고침 해주세요.'); return; }
    const p = new URLSearchParams(location.search);
    let invite = (p.get('invite')||'').toUpperCase();
    try{ if(invite) sessionStorage.setItem('skopos_invite', invite); else invite = sessionStorage.getItem('skopos_invite')||''; }catch(e){}
    let joinMsg = '';
    if(invite){
      const j = await call('join',{code:invite});
      try{ sessionStorage.removeItem('skopos_invite'); }catch(e){}
      if(j.success){ try{ window.SkoposTrack && SkoposTrack.event('couple_join',{}); }catch(e){} try{ history.replaceState({},'',location.pathname); }catch(e){} }
      else joinMsg = j.message || '초대 코드를 확인하지 못했어요.';
    }
    const st = await call('report');
    if(!st.success){ viewNone(st.message); return; }
    if(!st.couple){ viewNone(joinMsg); return; }
    if(st.ready){ viewReport(st); return; }
    viewProgress(st.couple, p.get('new')==='1');
  }catch(e){ console.error(e); viewNone('잠시 후 다시 시도해 주세요.'); }
}

window.addEventListener('DOMContentLoaded',()=>{
  if(!window.SkoposAuth){ viewNone('로그인 모듈을 불러오지 못했어요. 새로고침 해주세요.'); return; }
  SkoposAuth.guard({
    subtitle:'커플 리포트는 <strong>로그인 후</strong> 확인할 수 있어요.<br>초대 링크로 오셨다면 로그인하면 바로 연결돼요.',
    onReady:(u)=>main(u)
  });
});
</script>
