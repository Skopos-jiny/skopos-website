<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 | SKOPOS 스코포스</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="/skopos-track.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1A1A2E;--pink:#E91E8C;--cream:#FBF6EC;--gray:#6B6B80;--line:#EFE6D8}
html,body{min-height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px;-webkit-font-smoothing:antialiased;text-align:center}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 24px 32px;box-shadow:0 10px 30px rgba(26,26,46,.06)}
.logo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:900;letter-spacing:.14em;font-size:.85rem;margin-bottom:28px}
.logo img{width:28px;height:28px}
.code{font-size:3.2rem;font-weight:900;letter-spacing:.04em;color:var(--pink);line-height:1;margin-bottom:14px}
h1{font-size:1.25rem;font-weight:900;margin-bottom:10px;line-height:1.45}
p{font-size:.92rem;color:var(--gray);line-height:1.75;margin-bottom:26px}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{display:block;padding:14px 18px;border-radius:50px;font-weight:700;font-size:.95rem;text-decoration:none}
.btn.p{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(233,30,140,.25)}
.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
.foot{margin-top:22px;font-size:.78rem;color:var(--gray)}
.foot a{color:var(--gray)}
</style>
</head>
<body>
<main class="card">
  <a class="logo" href="/"><img src="/favicon-48x48.png" alt="" width="28" height="28">SKOPOS</a>
  <div class="code">404</div>
  <h1>찾으시는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력되었을 수 있어요.<br>아래에서 원하시는 곳으로 바로 이동해 주세요.</p>
  <div class="btns">
    <a class="btn p" href="/skopos_quiz">3분 무료 검사 시작하기</a>
    <a class="btn s" href="/">스코포스 홈으로</a>
    <a class="btn s" href="/mypage">마이페이지 (내 결과 보기)</a>
  </div>
  <div class="foot">문의가 필요하시면 <a href="https://pf.kakao.com/_dtGjX/chat" target="_blank" rel="noopener">카카오톡 채널</a>로 편하게 말씀해 주세요.</div>
</main>
</body>
</html>
